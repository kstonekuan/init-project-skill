[package]
name = "<project-or-subdirectory-name>"
version = "0.0.0"
edition = "2024"

[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
missing_panics_doc = "allow"

# Build profiles.
# NOTE: Cargo only honours [profile.*] in the WORKSPACE-ROOT Cargo.toml. If you
# are initialising a workspace member, move these two tables to the root
# manifest (Cargo prints a warning and ignores them in member crates).

# Thin debug info: keep stack traces and panic locations but drop variable-level
# detail. Cuts target/ size ~50-70% with no practical downside for day-to-day
# development. Set `debug = true` per-project if you need a full interactive
# debugger (variable inspection, etc.).
[profile.dev]
debug = "line-tables-only"

# Aggressive release tuning for shipped binaries.
#   lto = true          full cross-crate inlining
#   codegen-units = 1   whole-program view for the optimiser (slower to compile,
#                       faster + smaller output)
#   strip = true        drop symbols
#   panic = "abort"     remove unwinding tables to shrink further
# CAVEAT: panic = "abort" disables std::panic::catch_unwind and
# `cargo test --release`. Plain `cargo test` still works (it builds under
# [profile.test], which keeps unwinding). If a crate relies on unwinding,
# override panic per-project.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
