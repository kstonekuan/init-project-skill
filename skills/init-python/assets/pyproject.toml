[project]
name = "<project-or-subdirectory-name>"
version = "0.0.0"
description = ""
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "ruff>=0.17.3", #
    "ty>=0.0.97",
]

[build-system]
requires = [
    "uv_build>=0.13.7", #
]
build-backend = "uv_build"

[tool.uv]
# Supply-chain hardening: refuse PyPI releases younger than 5 days.
# Catches most malicious releases (typically yanked within 1-3 days) without
# delaying legitimate CVE patches you'd pin explicitly anyway.
# Override per-package via `exclude-newer-package = { foo = false }` for
# trusted first-party packages.
# See: https://docs.astral.sh/uv/concepts/resolution/#exclude-newer
exclude-newer = "5 days"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ANN",
    "PTH",
    "RET",
    "SIM",
    "TID",
    "RUF",
]
ignore = ["E501", "B008", "C901", "RET504", "ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
possibly-unresolved-reference = "error"
